<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Мои Заметки</title>
</head>
<body>
    <button class="theme-toggle" id="theme-btn">Тема</button>

    <div class="wrapper">
        <header class="hero">
            <h1>Заметки</h1>
            <div class="main-card">
                <form action="{{ url_for('add_note') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <input type="text" name="title" placeholder="Заголовок" autocomplete="off">
                    <textarea name="content" placeholder="Что нового?" required></textarea>
                    <button type="submit" class="btn-save">Сохранить</button>
                </form>
            </div>
        </header>

        <div class="grid">
            {% for note in notes %}
            <div class="note-card">
                <h3>{{ note.title if note.title else "Без названия" }}</h3>
                <p>{{ note.content }}</p>
                <div class="actions">
                    <a href="{{ url_for('edit', id=note.id) }}" class="edit">ИЗМЕНИТЬ</a>
                    <a href="{{ url_for('delete', id=note.id) }}" class="delete">УДАЛИТЬ</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const btn = document.getElementById('theme-btn');
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
