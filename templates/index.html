<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Notes App</title>
</head>
<body>
    <div class="container">
        <h1>Note</h1>

        <form action="{{ url_for('add_note') }}" method="POST" class="note-form">
            <input type="text" name="title" placeholder="Title" autocomplete="off">
            <input type="text" name="content" placeholder="Content..." required autocomplete="off">
            <button type="submit" class="btn-add">+</button>
        </form>

        <div class="notes-grid">
            {% for note in notes %}
            <div class="note-card">
                <h3>{{ note.title if note.title else "Untitled" }}</h3>
                <p>{{ note.content }}</p>
                <div class="actions">
                    <a href="{{ url_for('edit', id=note.id) }}" class="edit-link">Edit</a>
                    <a href="{{ url_for('delete', id=note.id) }}" class="del-link">Delete</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
