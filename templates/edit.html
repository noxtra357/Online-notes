<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Scene</title>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Modify</h1>
        <form method="POST" class="note-form" style="flex-direction: column; padding: 30px;">
            <input type="text" name="title" value="{{ note.title }}" style="width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
            <textarea name="content" style="background: transparent; color: var(--text-dim); border: none; outline: none; font-size: 1.1rem; height: 200px; resize: none; padding: 10px;" required>{{ note.content }}</textarea>
            <button type="submit" class="btn-add" style="padding: 15px; margin-top: 20px;">Save Changes</button>
            <a href="{{ url_for('index') }}" style="text-align: center; margin-top: 20px; color: #555; text-decoration: none;">Discard</a>
        </form>
    </div>
</body>
</html>
