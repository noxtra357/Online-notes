<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Редактирование</title>
</head>
<body>
    <div class="wrapper">
        <div class="hero">
            <h1>Изменить</h1>
            <div class="main-card">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="text" name="title" value="{{ note.title }}">
                    <textarea name="content" required>{{ note.content }}</textarea>
                    <button type="submit" class="btn-save">Обновить</button>
                    <a href="{{ url_for('index') }}" style="display:block; margin-top:15px; color:gray; text-decoration:none;">Отмена</a>
                </form>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
    </script>
</body>
</html>
